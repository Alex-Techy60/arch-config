background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffee)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    color = rgba(ffffffaa)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 85
    halign = center
    valign = center
}

label {
    monitor =
    text = Alex
    color = rgba(ffffffff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, -85
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 58
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true

    outer_color = rgba(ffffffff)
    inner_color = rgba(181414cc)
    font_color = rgba(ffffffff)

    fade_on_empty = false
    fade_timeout = 0
    placeholder_text = <i>Password</i>
    hide_input = false

    position = 0, -155
    halign = center
    valign = center
}
